<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognito 学習用ログイン</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  button { padding: .5rem 1rem; margin: 0 .5rem .5rem 0; cursor: pointer; }
  pre { background: #f4f4f4; color: #222; padding: .75rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; border-radius: 4px; }
  h2 { margin-top: 1.75rem; font-size: 1.1rem; }
  .muted { color: #666; font-size: .9rem; }
  .err { color: #b00020; }
  [hidden] { display: none; }
</style>
</head>
<body>
<h1>Cognito 学習用ログイン</h1>
<p class="muted">認可コードフロー + PKCE。トークンの表示は学習用です（実アプリでは画面に出しません）。</p>

<div id="status"></div>

<section id="logged-out" hidden>
  <p>未ログインです。</p>
  <button id="btn-login">ログイン（Hosted UIへ）</button>
  <button id="btn-me-anon">/me をトークンなしで呼ぶ（401になるはず）</button>
  <h2>/me のレスポンス</h2>
  <pre id="out-anon">（未実行）</pre>
</section>

<section id="logged-in" hidden>
  <button id="btn-me-access">/me をアクセストークンで呼ぶ</button>
  <button id="btn-me-id">/me をIDトークンで呼ぶ</button>
  <button id="btn-me-anon2">/me をトークンなしで呼ぶ</button>
  <button id="btn-logout">ログアウト</button>

  <h2>/me のレスポンス</h2>
  <pre id="out-me">（未実行）</pre>

  <h2>アクセストークン（デコード結果）</h2>
  <pre id="out-access"></pre>
  <h2>IDトークン（デコード結果）</h2>
  <pre id="out-id"></pre>
  <h2>リフレッシュトークン</h2>
  <p class="muted">不透明な文字列で、JWTではありません。更新用なのでAPI呼び出しには使いません。</p>
  <pre id="out-refresh"></pre>
</section>

<script>
// Cognito settings injected by the server (see _render_page in main.py)
const CONFIG = __CONFIG__;

// Where Cognito sends the user after login. Must exactly match a callback URL
// registered on the app client (Terraform adds <API URL>/callback).
const redirectUri = location.origin + "/callback";
const $ = (id) => document.getElementById(id);

// ---- utility ----

// base64url = base64 with "-" and "_" instead of "+" and "/", and no "=" padding (used by PKCE and JWT)
const b64url = (buf) =>
  btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

// Cryptographically secure random string (for the PKCE verifier and the state value)
function randomString(bytes = 48) {
  return b64url(crypto.getRandomValues(new Uint8Array(bytes)));
}

// SHA-256 hash (crypto.subtle is only available on HTTPS pages, which API Gateway provides)
async function sha256(text) {
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
}

// Decode a JWT for display only. This does NOT verify the signature; the server does that.
function decodeJwt(token) {
  const part = (s) => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/")))));
  const [h, p] = token.split(".");
  return { header: part(h), payload: part(p) };
}

function showStatus(msg, isError = false) {
  const el = $("status");
  el.textContent = msg; // textContent (not innerHTML) so messages cannot inject HTML
  el.className = isError ? "err" : "muted";
}

// ---- Step 1: start the login (authorization code flow with PKCE) ----
async function login() {
  // PKCE: keep a secret "verifier" in the browser and send only its hash ("challenge").
  // Whoever steals the authorization code cannot redeem it without the verifier.
  const verifier = randomString();

  // "state" is echoed back by Cognito and checked later, to detect forged callbacks (CSRF)
  const state = randomString(16);
  sessionStorage.setItem("pkce_verifier", verifier);
  sessionStorage.setItem("oauth_state", state);

  const params = new URLSearchParams({
    response_type: "code",
    client_id: CONFIG.clientId,
    redirect_uri: redirectUri,
    scope: "openid email profile",
    state,
    code_challenge: b64url(await sha256(verifier)),
    code_challenge_method: "S256",
  });

  // Leave for the Cognito Hosted UI, where the user enters email and password
  location.href = `${CONFIG.cognitoBaseUrl}/oauth2/authorize?${params}`;
}

// ---- Step 2: back from Cognito with ?code=...&state=...; exchange the code for tokens ----
async function handleCallback(code, state) {
  const savedState = sessionStorage.getItem("oauth_state");
  const verifier = sessionStorage.getItem("pkce_verifier");

  // Both values are single-use: remove them immediately
  sessionStorage.removeItem("oauth_state");
  sessionStorage.removeItem("pkce_verifier");

  if (!savedState || state !== savedState) {
    throw new Error("stateが一致しません（CSRF対策）。もう一度ログインしてください。");
  }
  if (!verifier) {
    throw new Error("code_verifierがありません。もう一度ログインしてください。");
  }

  // Send the code plus the original verifier; Cognito checks that SHA-256(verifier) equals the challenge
  const res = await fetch(`${CONFIG.cognitoBaseUrl}/oauth2/token`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      grant_type: "authorization_code",
      client_id: CONFIG.clientId,
      code,
      redirect_uri: redirectUri, // must be identical to the one used in the authorize request
      code_verifier: verifier,
    }),
  });
  const body = await res.json();
  if (!res.ok) throw new Error("トークン交換に失敗: " + JSON.stringify(body));

  // Learning only: sessionStorage is readable by any script on the page (XSS).
  // Real apps should keep tokens in memory or use a server-side session (BFF).
  sessionStorage.setItem("tokens", JSON.stringify(body));
}

// ---- Step 3: call the protected API ----
async function callMe(token) {
  // The API Gateway JWT authorizer reads this header; without a valid token it returns 401
  const headers = token ? { Authorization: "Bearer " + token } : {};
  const res = await fetch("/me", { headers });
  const text = await res.text();
  let pretty = text;
  try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
  return `HTTP ${res.status}\n${pretty}`;
}

function logout() {
  // Drop the local tokens, then end the Cognito session via the Hosted UI /logout endpoint.
  // logout_uri must match a logout URL registered on the app client.
  sessionStorage.removeItem("tokens");
  const params = new URLSearchParams({ client_id: CONFIG.clientId, logout_uri: location.origin + "/" });
  location.href = `${CONFIG.cognitoBaseUrl}/logout?${params}`;
}

// ---- render ----
function renderLoggedIn(tokens) {
  $("logged-in").hidden = false;
  const show = (id, jwt) => {
    $(id).textContent = JSON.stringify(decodeJwt(jwt), null, 2);
  };
  show("out-access", tokens.access_token);
  show("out-id", tokens.id_token);
  $("out-refresh").textContent = tokens.refresh_token || "(なし)";

  // Try both token types: the JWT authorizer accepts either one
  $("btn-me-access").onclick = async () => ($("out-me").textContent = await callMe(tokens.access_token));
  $("btn-me-id").onclick = async () => ($("out-me").textContent = await callMe(tokens.id_token));
  // Without a token the request is rejected by API Gateway and never reaches ECS
  $("btn-me-anon2").onclick = async () => ($("out-me").textContent = await callMe(null));
  $("btn-logout").onclick = logout;
}

function renderLoggedOut() {
  $("logged-out").hidden = false;
  $("btn-login").onclick = login;
  $("btn-me-anon").onclick = async () => ($("out-anon").textContent = await callMe(null));
}

async function main() {
  const q = new URLSearchParams(location.search);

  // Cognito reports problems (e.g. a redirect_uri mismatch) as ?error=...
  if (q.get("error")) {
    showStatus(`Cognitoからエラー: ${q.get("error")} ${q.get("error_description") || ""}`, true);
    renderLoggedOut();
    return;
  }

  // Returning from the Hosted UI with an authorization code
  if (location.pathname === "/callback" && q.get("code")) {
    try {
      showStatus("トークンを取得しています…");
      await handleCallback(q.get("code"), q.get("state"));
      showStatus("ログインしました。");
    } catch (e) {
      showStatus(e.message, true);
    }
    // Remove the code from the address bar: it is single-use and should not stay in the history
    history.replaceState(null, "", "/");
  }

  // Show the logged-in view if tokens are stored, otherwise the login button
  const saved = sessionStorage.getItem("tokens");
  if (saved) {
    renderLoggedIn(JSON.parse(saved));
  } else {
    renderLoggedOut();
  }
}

main();
</script>
</body>
</html>
